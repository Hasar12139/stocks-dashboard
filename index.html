  if (cs.length) {
    const lx = X(cs.length - 1), ly = Y(cs[cs.length - 1]);
    svg += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="var(--ink-2)" stroke="var(--surface)" stroke-width="2"/>`;
  }
  svg += `</svg>`;
  el.innerHTML = svg;
}

function spark(el, r, px) {
  if (r.source === "xhs") return sparkXhs(el, r, px);
  const w = el.clientWidth || 300, h = 64, pad = 4;
  const cs = r.closes.map(c => c[1]);
  if (px != null) cs.push(px);
  const all = cs.concat([r.entry_low, r.entry_high, r.stop_loss].filter(v => v != null));
  const y0 = Math.min(...all), y1 = Math.max(...all), span = (y1 - y0) || 1;
  const Y = v => h - pad - (v - y0) / span * (h - 2 * pad);
  const X = i => pad + i / (cs.length - 1) * (w - 2 * pad);
  let svg = `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">`;
  const lo = r.entry_low, hi = r.entry_high;
  if (lo != null || hi != null) {
    const zt = Y(hi != null ? hi : lo), zb = lo != null ? Y(lo) : h - pad;
    svg += `<rect x="0" y="${zt}" width="${w}" height="${Math.max(zb - zt, 2)}" fill="var(--good-soft)"/>`;
    svg += `<line x1="0" x2="${w}" y1="${zt}" y2="${zt}" stroke="var(--good)" stroke-width="1" opacity="0.5"/>`;
  }
  if (r.stop_loss != null) {
    const sy = Y(r.stop_loss);
    svg += `<line x1="0" x2="${w}" y1="${sy}" y2="${sy}" stroke="var(--crit)" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.8"/>`;
  }
  const pts = cs.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  svg += `<polyline points="${pts}" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  const lx = X(cs.length - 1), ly = Y(cs[cs.length - 1]);
  const st = stopHit(r, cs[cs.length - 1]) ? "var(--crit)" : (zoneState(r, cs[cs.length - 1]) === "inside" ? "var(--good)" : "var(--ink-2)");
  svg += `<circle cx="${lx}" cy="${ly}" r="4" fill="${st}" stroke="var(--surface)" stroke-width="2"/></svg>`;
  el.innerHTML = svg;
}

const state = {};
for (const r of DATA) {
  BYKEY[K(r)] = r;
  const eod = r.closes.length ? r.closes[r.closes.length - 1][1] : null;
  state[K(r)] = { px: eod, chg: null, live: false, eod };
}

function severity(r) {
  const s = state[K(r)];
  if (s.px == null) return 9;
  if (r.source === "xhs") return xhsNear(r, s.px) ? 2 : 6;
  if (stopHit(r, s.px)) return 0;
  const z = zoneState(r, s.px);
  return { inside: 1, near: 2, above: 3, below: 4, no_zone: 5 }[z];
}

function cardHTML(r, i) {
  const key = K(r), s = state[key];
  const stance = STANCE[r.stance] || [r.stance, ""];
  const xhs = r.source === "xhs";
  const dt = `<span>${r.video_date.slice(5)}期 · ${r.days_old}天前</span>`;
  let row2tail, meta;
  if (xhs) {
    const n = (r.key_levels || []).filter(v => typeof v === "number").length;
    row2tail = `<span class="lvn">${n ? n + " 个画位" : "暂无画位"}</span><span class="state" id="st-${key}"></span>`;
    meta = `<span class="s" id="sup-${key}"></span><span class="r" id="res-${key}"></span>${dt}`;
  } else {
    const zt = zoneText(r);
    row2tail = `<span class="state" id="st-${key}"></span>`;
    meta = `${zt ? `<span class="zone">${zt}</span>` : ""}${r.stop_loss != null ? `<span class="stopv">止损 ${r.stop_loss}</span>` : ""}${dt}`;
  }
  return `<article class="card" tabindex="0" data-tk="${key}" style="--i:${i}">
    <div class="row1">
      <span class="tk">${esc(r.ticker)}</span>
      ${xhs ? '<span class="src">📕</span>' : ""}
      ${r.needs_review ? '<span class="src" title="代码未与描述核对">⚠️</span>' : ""}
      ${r.recur >= 2 ? `<span class="recur" title="出现于 ${r.recur} 期视频">↩ ${r.recur}期</span>` : ""}
      <span class="px" id="px-${key}">${fmt(s.px)}</span>
    </div>
    <div class="row2">
      <span class="pill ${stance[1]}">${stance[0]}</span>
      ${row2tail}
      <span class="chg" id="chg-${key}"></span>
    </div>
    <div id="sp-${key}"></div>
    <div class="meta">
      ${meta}
    </div>
    <div class="more"><div class="more-inner" id="more-${key}"></div></div>
  </article>`;
}

function renderState(k) {
  const r = BYKEY[k], s = state[k];
  const stEl = document.getElementById("st-" + k);
  if (r.source === "xhs") {
    const { nSup, nRes } = xhsLevels(r, s.px);
    const supEl = document.getElementById("sup-" + k), resEl = document.getElementById("res-" + k);
    if (supEl) supEl.textContent = nSup != null ? `支撑 ${fmt(nSup)}` : "";
    if (resEl) resEl.textContent = nRes != null ? `阻力 ${fmt(nRes)}` : "";
    const near = xhsNear(r, s.px);
    stEl.textContent = near ? (near === "sup" ? "◐ 近支撑" : "◐ 近阻力") : "";
    stEl.className = "state" + (near ? " near" : "");
  } else if (s.px == null) {
    stEl.textContent = "无行情"; stEl.className = "state";
  } else if (stopHit(r, s.px)) {
    stEl.textContent = "▼ 破止损"; stEl.className = "state stop";
  } else {
    const z = zoneState(r, s.px);
    stEl.textContent = STATE_TXT[z];
    stEl.className = "state " + (z === "inside" ? "inside" : z === "near" ? "near" : "");
  }
  const chgEl = document.getElementById("chg-" + k);
  if (s.chg != null) {
    chgEl.textContent = (s.chg > 0 ? "+" : "") + s.chg.toFixed(2) + "%";
    chgEl.className = "chg " + (s.chg > 0 ? "up" : s.chg < 0 ? "dn" : "");
  } else chgEl.textContent = s.live ? "" : "基准";
}

function refreshSummary() {
  const xhs = srcTab === "xhs";
  let a = 0, b = 0, c = 0;   // a=区间内/近支撑(绿) b=接近/有画位 c=破止损/近阻力(红)
  for (const r of DATA) {
    if (srcTab !== "all" && (r.source || "yt") !== srcTab) continue;
    const s = state[K(r)];
    if (r.source === "xhs") {
      if (!xhs) continue;    // 小红书卡片仅在 Dexter 页计入
      if ((r.key_levels || []).filter(v => typeof v === "number").length) b++;
      const near = xhsNear(r, s.px);
      if (near === "sup") a++;
      else if (near === "res") c++;
    } else {
      if (xhs) continue;
      if (s.px == null) continue;
      if (stopHit(r, s.px)) { c++; continue; }
      const z = zoneState(r, s.px);
      if (z === "inside") a++;
      else if (z === "near") b++;
    }
  }
  document.getElementById("n-in").textContent = a;
  document.getElementById("n-near").textContent = b;
  document.getElementById("n-stop").textContent = c;
  document.getElementById("lbl-a").textContent = xhs ? "近支撑" : "区间内";
  document.getElementById("lbl-b").textContent = xhs ? "有画位" : "接近";
  document.getElementById("lbl-c").textContent = xhs ? "近阻力" : "破止损";
}

function expand(card, r) {
  const el = document.getElementById("more-" + K(r));
  if (!el.dataset.done) {
    el.dataset.done = "1";
    const stance = (STANCE[r.stance] || [r.stance])[0];
    const parts = [`<h4>本期观点</h4><p><b>${stance}</b>${r.rationale ? " · " + esc(r.rationale) : ""}</p>`];
    const full = [];
    if (r.analysis) { full.push(`<h4>观点演变</h4><p>${esc(r.analysis)}</p>`); }
    if (r.quote) { full.push(`<blockquote class="quote">「${esc(r.quote)}」</blockquote>`); }
    if (r.video_url) {
      const url = r.video_url + (r.ts ? `&t=${r.ts}s` : "");
      full.push(`<a class="vlink" href="${url}" target="_blank" rel="noopener">▶ 跳到视频讲解处(${r.video_date}期)</a>`);
    }
    if (full.length) {
      parts.push(`<button class="reveal" type="button">完整演变与原话 ▾</button><div class="full" hidden>${full.join("")}</div>`);
    }
    el.innerHTML = parts.join("");
  }
  card.classList.toggle("open");
}
const esc = t => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };

// ---------- render ----------
const grid = document.getElementById("grid");
const sorted = [...DATA].sort((a, b) => severity(a) - severity(b) || a.ticker.localeCompare(b.ticker));
grid.innerHTML = sorted.map((r, i) => cardHTML(r, i)).join("");
for (const r of DATA) {
  spark(document.getElementById("sp-" + K(r)), r, null);
  renderState(K(r));
}
refreshSummary();
document.getElementById("subline").textContent = `${DATA.length} 只在关注 · 数据基准 ${DATA[0]?.closes.length ? new Date(DATA[0].closes[DATA[0].closes.length - 1][0] * 1000).toISOString().slice(0, 10) : ""} 收盘`;

grid.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const rb = e.target.closest("button.reveal");
  if (rb) {
    const full = rb.nextElementSibling;
    full.hidden = !full.hidden;
    rb.textContent = full.hidden ? "完整演变与原话 ▾" : "收起 ▴";
    return;
  }
  const card = e.target.closest(".card");
  if (card) expand(card, BYKEY[card.dataset.tk]);
});
grid.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.classList.contains("card"))
    expand(e.target, BYKEY[e.target.dataset.tk]);
});

// ---------- filters (source tab × signal filter) ----------
const fbox = document.getElementById("filters"), thumb = document.getElementById("thumb");
const sbox = document.getElementById("srctabs"), sthumb = document.getElementById("srcthumb");
function place(box, tb, btn) { tb.style.left = btn.offsetLeft + "px"; tb.style.width = btn.offsetWidth + "px"; }

function applyFilters() {
  for (const r of DATA) {
    const s = state[K(r)];
    const card = grid.querySelector(`[data-tk="${K(r)}"]`);
    if (!card) continue;
    let show = srcTab === "all" || (r.source || "yt") === srcTab;
    if (show && sigFilter === "sig") {
      show = r.source === "xhs"
        ? xhsNear(r, s.px) != null
        : s.px != null && (stopHit(r, s.px) || ["inside", "near"].includes(zoneState(r, s.px)));
    }
    if (show && sigFilter === "recur") show = r.recur >= 2;
    card.classList.toggle("hidden", !show);
  }
  refreshSummary();
}

place(fbox, thumb, fbox.querySelector("button.on"));
place(sbox, sthumb, sbox.querySelector("button.on"));
sbox.addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  sbox.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
  place(sbox, sthumb, btn);
  srcTab = btn.dataset.src;
  applyFilters();
});
fbox.addEventListener("click", e => {
  const btn = e.target.closest("button"); if (!btn) return;
  fbox.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
  place(fbox, thumb, btn);
  sigFilter = btn.dataset.f;
  applyFilters();
});
addEventListener("resize", () => { place(fbox, thumb, fbox.querySelector("button.on")); place(sbox, sthumb, sbox.querySelector("button.on")); });
applyFilters();

// ---------- live prices via IBKR connector ----------
const notice = document.getElementById("notice");
const liveEl = document.getElementById("live"), livetxt = document.getElementById("livetxt");
let liveCount = 0, errCodes = {};

function showNotice(msg) { notice.textContent = msg; notice.classList.add("show"); }

function applyLive(r, payload, storedAt) {
  const key = K(r), s = state[key];
  const last = payload && payload.last;
  const px = last && typeof last.price === "number" ? last.price : null;
  if (px != null && px !== s.px) {
    s.px = px;
    const el = document.getElementById("px-" + key);
    el.textContent = fmt(px);
    el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
    spark(document.getElementById("sp-" + key), r, px);
  }
  if (payload && payload.change && typeof payload.change.change_pct === "number") s.chg = payload.change.change_pct;
  if (!s.live) { s.live = true; liveCount++; }
  renderState(key);
  refreshSummary();
  liveEl.classList.add("on");
  const t = storedAt ? new Date(storedAt) : new Date();
  livetxt.textContent = `实时 · ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
}

function startWatches() {
  if (!LIVE) {
    livetxt.textContent = "收盘基准 · 随视频更新";
    document.querySelector("footer").firstChild.textContent =
      "数据:📺 美股超级掘金 + 📕 Dexter 的个股推荐 × 收盘基准价(每期新视频后更新)。上方标签切换来源。";
    return;
  }
  if (!window.claude || window.claude.mcp === undefined) {
    showNotice("此环境不支持连接器,显示收盘基准数据。");
    return;
  }
  for (const r of DATA) {
    if (r.conid == null) continue;
    window.claude.mcp.watchTool(
      SERVER, "get_price_snapshot",
      { contract_id: r.conid, market_data_names: ["last", "change"] },
      ev => {
        if (ev.type === "data") {
          applyLive(r, ev.result.payload, ev.result.cache && ev.result.cache.storedAt);
        } else {
          const code = ev.error.code;
          errCodes[code] = (errCodes[code] || 0) + 1;
          if (code === "needs_reauth") showNotice("IBKR 连接需要重新登录:在 claude.ai 设置 → 连接器 中重新连接 Interactive Brokers,然后刷新本页。");
          else if (code === "server_not_connected") showNotice("未找到 IBKR 连接器:在 claude.ai 设置 → 连接器 中添加 Interactive Brokers 后刷新本页。");
          else if (code === "not_granted" || code === "capability_disabled") showNotice("本次打开未授予行情权限,显示收盘基准数据。");
          else if (errCodes[code] >= DATA.length) showNotice("行情服务暂时不可用,显示收盘基准数据,稍后自动重试。");
        }
      },
      { cache: { staleTime: 60000 }, refetchInterval: 300000 }
    );
  }
}
startWatches();
</script>
